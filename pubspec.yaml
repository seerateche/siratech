name: sira_tech_studio
description: Sira Tech Creative Studio — personalized songs and videos for life occasions.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: ^0.20.3
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.2.0
  image_picker: ^1.1.2
  image: ^4.2.0
  ffmpeg_kit_flutter_new: ^4.6.1
  video_player: ^2.9.0
  share_plus: ^10.0.0
  gal: ^1.6.0
  path_provider: ^2.1.3
  path: ^1.9.0
  uuid: ^4.4.0
  file_picker: ^11.0.3
  arabic_reshaper: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
