name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Regenerate native Android scaffolding for current Flutter version
        run: |
          rm -rf android
          flutter create --platforms=android --org com.siratech.sira_tech_studio .
          
          # Ensure minSdk is at least 24 for ffmpeg_kit
          python3 - <<'PYEOF'
          from pathlib import Path
          import re
          for p in [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]:
              if p.exists():
                  txt = p.read_text()
                  txt = re.sub(r'minSdk\s*=\s*(?:flutter\.minSdkVersion|\d+)', 'minSdk = 24', txt)
                  txt = re.sub(r'minSdkVersion\s+(?:flutter\.minSdkVersion|\d+)', 'minSdkVersion 24', txt)
                  p.write_text(txt)
                  print("Patched minSdk 24 in", p)
          
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              mtxt = manifest.read_text()
              perms = """    <uses-permission android:name="android.permission.INTERNET"/>
    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n"""
              if "android.permission.INTERNET" not in mtxt:
                  mtxt = mtxt.replace("<application", perms + "    <application")
                  manifest.write_text(mtxt)
                  print("Added permissions to AndroidManifest.xml")
          PYEOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: |
          set +e
          flutter build apk --release > build_out.txt 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            tail -n 50 build_out.txt
            ERR_MSG=$(tail -n 15 build_out.txt | tr '\n' ' ' | sed 's/"//g')
            echo "::error title=BuildFailure::$ERR_MSG"
            exit $EXIT_CODE
          fi

      - name: Locate generated APK
        run: |
          echo "Built APK files:"
          find build -name "*.apk" || true

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: sira-tech-apk
          path: |
            build/**/*.apk
            **/app-release.apk
            **/app-*.apk
          if-no-files-found: error
          retention-days: 7
