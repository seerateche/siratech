name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK platform 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" || true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare native Android project
        run: |
          rm -rf android
          python3 scripts/prepare_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Patch pub-cache plugin compileSdk
        run: python3 scripts/patch_pub_cache.py

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK (Release)
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee build_err.log || {
            tail -n 60 build_err.log
            ERR_MSG=$(tail -n 25 build_err.log | tr '\n' ' ' | sed 's/"//g' | cut -c 1-500)
            echo "::error title=GradleBuildError::$ERR_MSG"
            exit 1
          }

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build_err.log
          retention-days: 3

      - name: Locate built APK
        run: |
          echo "=== Found APK files: ==="
          find build -name "*.apk" -o -name "*.aab"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: sira-tech-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/**/*.apk
          if-no-files-found: error
          retention-days: 7
