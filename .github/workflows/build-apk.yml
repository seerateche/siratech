name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: |
          set +e
          flutter build apk --release > build_out.txt 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            tail -n 50 build_out.txt
            ERR_MSG=$(tail -n 15 build_out.txt | tr '\n' ' ' | sed 's/"//g')
            echo "::error title=BuildFailure::$ERR_MSG"
            exit $EXIT_CODE
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: sira-tech-apk
          path: |
            build/**/*.apk
            **/app-release.apk
            **/app-*.apk
          if-no-files-found: error
          retention-days: 7
