name: Build APK

# Runs manually from the GitHub website: Actions tab -> "Build APK" -> Run workflow.
# After ~10-15 min, download the "sira-tech-apk" artifact = your installable APK.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Download Amiri font (Arabic captions)
        run: |
          mkdir -p assets/fonts
          curl -L -o assets/fonts/Amiri.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Regular.ttf
          ls -la assets/fonts

      - name: Enable font asset in pubspec
        run: |
          python3 - <<'PYEOF'
          s = open("pubspec.yaml").read()
          s = s.replace("  # assets:\n  #   - assets/fonts/Amiri.ttf", "  assets:\n    - assets/fonts/Amiri.ttf")
          open("pubspec.yaml","w").write(s)
          PYEOF

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: sira-tech-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
