name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare native Android project
        run: |
          rm -rf android
          python3 scripts/prepare_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: |
          set +e
          flutter analyze > analyze_out.txt 2>&1
          cat analyze_out.txt
          ERR_MSG=$(head -n 20 analyze_out.txt | tr '\n' ' ' | sed 's/"//g')
          echo "::error title=AnalyzeError::$ERR_MSG"
          exit 1
